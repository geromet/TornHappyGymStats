name: Issue 73 branch proof

on:
  push:
    branches:
      - agent/issue-73-war-derivation-decomposition

jobs:
  proof:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Restore
        run: dotnet restore HappyGymStats.sln
      - name: Build solution
        run: dotnet build HappyGymStats.sln --no-restore
      - name: Run derivation characterization tests
        run: dotnet test tests/HappyGymStats.Tests/HappyGymStats.Tests.csproj --no-build --no-restore --filter "FullyQualifiedName~WarStateDerivationEngineTests|FullyQualifiedName~WarStateDerivationPolicyRegressionTests"
      - name: Verify whitespace
        run: git diff --check origin/main...HEAD
