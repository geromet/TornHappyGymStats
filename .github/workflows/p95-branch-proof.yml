name: P95 Branch Proof

on:
  push:
    branches:
      - agent/issue-95-security-delete-confirmation

permissions:
  contents: read

jobs:
  focused-proof:
    runs-on: ubuntu-latest
    env:
      DOTNET_NOLOGO: "1"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore

      - name: Security destructive-action rendered proof
        run: dotnet test tests/HappyGymStats.Tests/HappyGymStats.Tests.csproj --nologo --no-restore --filter FullyQualifiedName~SecurityDestructiveActionRenderedTests

      - name: Verify whitespace formatting
        run: dotnet format whitespace --verify-no-changes --no-restore
