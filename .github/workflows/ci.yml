# CI — run each proof tier in the environment that can actually prove it.
name: CI

on:
  push:
    branches: [main, fleet/stable/tooling-hygiene]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: build, verify contracts, test
    runs-on: ubuntu-latest
    env:
      DOTNET_NOLOGO: "1"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      # ripgrep is not guaranteed on the runner and several required verifiers
      # depend on it. Missing verifier tooling must be unavailable/red, not a
      # false "no match" success.
      - name: Install ripgrep
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ripgrep

      - name: Show tool versions
        run: |
          rg --version | head -1
          shellcheck --version | grep version:

      - name: Install .NET (version from global.json)
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Cache NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/global.json', 'Directory.Packages.props') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore

      # Canonical source/contracts/build gate plus the hermetic legacy suite.
      # The explicit tier jobs below run the same inventory through isolated
      # UnitTests and IntegrationTests projects while #69 migrates file layout.
      - name: scripts/verify/build-and-test.sh
        run: bash scripts/verify/build-and-test.sh

  unit:
    name: unit tests
    runs-on: ubuntu-latest
    env:
      DOTNET_NOLOGO: "1"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Install .NET (version from global.json)
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Restore unit tier
        run: dotnet restore tests/HappyGymStats.UnitTests/HappyGymStats.UnitTests.csproj
      - name: Run unit tier
        run: dotnet test tests/HappyGymStats.UnitTests/HappyGymStats.UnitTests.csproj --nologo --no-restore

  integration:
    name: integration tests (non-Postgres)
    runs-on: ubuntu-latest
    env:
      DOTNET_NOLOGO: "1"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Install .NET (version from global.json)
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Restore integration tier
        run: dotnet restore tests/HappyGymStats.IntegrationTests/HappyGymStats.IntegrationTests.csproj
      - name: Run non-Postgres integration tier
        run: dotnet test tests/HappyGymStats.IntegrationTests/HappyGymStats.IntegrationTests.csproj --nologo --no-restore --filter "Category!=PostgresApiIntegration"

  tier-parity:
    name: test tier discovery parity
    runs-on: ubuntu-latest
    env:
      DOTNET_NOLOGO: "1"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Install .NET (version from global.json)
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Restore legacy and explicit tiers
        run: |
          dotnet restore tests/HappyGymStats.Tests/HappyGymStats.Tests.csproj
          dotnet restore tests/HappyGymStats.UnitTests/HappyGymStats.UnitTests.csproj
          dotnet restore tests/HappyGymStats.IntegrationTests/HappyGymStats.IntegrationTests.csproj
      - name: Prove no test disappeared or was duplicated
        run: bash scripts/verify/test-tier-parity.sh

  architecture:
    name: architecture tests
    runs-on: ubuntu-latest
    env:
      DOTNET_NOLOGO: "1"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Install .NET (version from global.json)
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Cache NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/global.json', 'Directory.Packages.props') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Run architecture tier
        run: dotnet test tests/HappyGymStats.ArchitectureTests/HappyGymStats.ArchitectureTests.csproj --nologo

  postgres:
    name: postgres integration
    runs-on: ubuntu-latest
    env:
      # A skipped test is reported as success by GitHub/xUnit, so this job opts
      # into the repository's inverse semantics: Docker/test unavailability is a
      # hard failure, never a green skip.
      HAPPYGYMSTATS_REQUIRE_POSTGRES_INTEGRATION: "1"
      HAPPYGYMSTATS_POSTGRES_START_TIMEOUT_SECONDS: "300"
      DOTNET_NOLOGO: "1"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Install .NET (version from global.json)
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Cache NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/global.json', 'Directory.Packages.props') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore

      - name: Prove Docker is available
        run: docker info

      - name: Run non-skippable Postgres integration tier
        run: bash scripts/verify/s07-postgres-integration.sh

  browser-crypto:
    name: browser crypto regression
    runs-on: ubuntu-latest
    env:
      DOTNET_NOLOGO: "1"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Install .NET (version from global.json)
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # Reuse the repository-native, user-local Playwright bootstrap. It installs
      # Python Playwright into .venv and Chromium into the Playwright user cache.
      - name: Bootstrap browser verifier
        run: bash scripts/screenshot-board.sh --setup

      - name: Execute Web Crypto in Chromium
        run: .venv/bin/python scripts/verify/browser-crypto-regression.py

  format:
    name: dotnet format
    runs-on: ubuntu-latest
    env:
      DOTNET_NOLOGO: "1"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore

      # `whitespace`, not bare `dotnet format`: bare format applies analyzer code
      # fixes too and has previously changed generated SQL semantics here.
      - name: Check formatting
        run: dotnet format whitespace --verify-no-changes --no-restore

  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run shellcheck
        run: |
          shopt -s globstar nullglob
          files=(scripts/**/*.sh)
          printf 'linting %d scripts\n' "${#files[@]}"
          shellcheck --severity=warning "${files[@]}"
