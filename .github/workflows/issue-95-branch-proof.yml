name: Issue 95 branch proof

on:
  push:
    branches:
      - agent/issue-95-security-delete-confirmation

permissions:
  contents: read

jobs:
  proof:
    runs-on: ubuntu-24.04
    env:
      DOTNET_NOLOGO: "1"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Install verifier dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ripgrep
      - name: Restore
        run: dotnet restore
      - name: Build and run hermetic test gate
        run: bash scripts/verify/build-and-test.sh
      - name: Run architecture tier
        run: dotnet test tests/HappyGymStats.ArchitectureTests/HappyGymStats.ArchitectureTests.csproj --nologo
      - name: Check formatting
        run: dotnet format whitespace --verify-no-changes --no-restore
      - name: Verify diff whitespace
        run: git diff --check origin/main...HEAD
