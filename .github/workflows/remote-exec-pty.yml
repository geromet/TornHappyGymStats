name: Remote exec PTY proof

on:
  pull_request:
    branches: [main]
    paths:
      - scripts/lib/remote-exec.sh
      - scripts/verify/remote-transport-policy.sh
      - scripts/verify/remote-exec-pty-integration.sh
      - scripts/verify/remote-exec-pty-driver.py
      - scripts/verify/manifest.tsv
      - .github/workflows/ci.yml
      - .github/workflows/remote-exec-pty.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: remote-exec-pty-${{ github.ref }}
  cancel-in-progress: true

jobs:
  transport:
    name: disposable SSH/PTTY transport
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Install disposable SSH server
        run: sudo apt-get update -qq && sudo apt-get install -y -qq openssh-server
      - name: Exercise remote-exec through a real PTY
        run: bash scripts/verify/remote-exec-pty-integration.sh
