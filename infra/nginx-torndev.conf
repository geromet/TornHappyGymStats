# Dev host routing — torndev.geromet.com
#
# Ownership: torndev.geromet.com only (no path-mount under torn.geromet.com).
# A dedicated host keeps the cookie jar separate from production, and lets the
# dev deployment ship the byte-identical build: <base href="/"> stays correct,
# and the Blazor Interactive Server circuit stays at /_blazor.
#
# TLS reuses the Cloudflare origin certificate, which covers *.geromet.com.
# Note this is a single-label subdomain on purpose — the wildcard does not
# cover dev.torn.geromet.com (that needs a paid Cloudflare tier).
#
# Upstreams are the dev services, NOT production:
#   API    127.0.0.1:5147   (prod: 5047)
#   Blazor 127.0.0.1:5282   (prod: 5182)

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name torndev.geromet.com;

    ssl_certificate     /etc/ssl/cloudflare/origin.pem;
    ssl_certificate_key /etc/ssl/cloudflare/origin.key;

    location /data/surfaces/ {
        alias /var/www/happygymstats-dev/data/surfaces-cache/;
        access_log off;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Poller -> API transport only. Keep the dev route private for the same
    # reason as production: the public proxy must not expose internal actions.
    location = /api/v1/war/internal/notify {
        return 404;
    }

    location /api/hub/war {
        proxy_pass         http://127.0.0.1:5147;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_read_timeout 300s;
    }

    location /api/ {
        proxy_pass         http://127.0.0.1:5147;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
    }

    # Blazor — WebSocket upgrade required for SignalR (Interactive Server render mode)
    location / {
        proxy_pass         http://127.0.0.1:5282;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_read_timeout 3600s;
    }
}

server {
    listen 80;
    server_name torndev.geromet.com;
    return 301 https://$host$request_uri;
}
